[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
color-eyre = "0.6.5"
iced = { version = "0.14", features = ["tokio"] }
iced_fonts = { version = "0.3.0", features = ["lucide"] }
keyring = "4.2"
oauth2 = { version = "5", default-features = false, features = [
  "reqwest",
  "rustls-tls",
  "timing-resistant-secret-traits",
] }
open = "5.4"
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[workspace.metadata.crane]
name = "lumina"
